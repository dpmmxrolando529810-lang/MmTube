# nginx site for MMTube — proxy /api to the Flask worker, serve site + files statically.
# Replace __DOMAIN__ with your domain (deploy.sh does this for you).

limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/m;

server {
    listen 80;
    server_name __DOMAIN__;
    root /var/www/mmtube/site;
    index index.html;
    gzip on;

    client_max_body_size 1m;

    # Static site + APK
    location / {
        try_files $uri $uri/ =404;
    }

    # MMTube APK downloads
    location = /MMTube.apk {
        types { } default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=MMTube.apk";
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
    }

    # Download files produced by the bot / web API
    location /d/ {
        alias /var/www/mmtube/files/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
    }

    # Flask API
    location /api/ {
        limit_req zone=apilimit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 10s;
    }
}
